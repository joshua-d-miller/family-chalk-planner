name: Release
# Merging a pull request into main that raises the version in package.json releases it: this tags
# the merge v<version>, runs the tests, and publishes a GitHub Release with that version's notes from
# CHANGELOG.md, plus the Docker image ghcr.io/<owner>/family-chalk-planner. A merge that leaves the
# version alone (the tag already exists) releases nothing. Pushing a tag like v0.4.4 by hand still
# works too. The tag is made here, in the same run, because a tag pushed with the workflow's own
# token never starts another workflow.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
  packages: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      # TAG for every step after this; on main, made from package.json (and skipped if it exists)
      - name: Which version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but package.json says ${v#v}"; exit 1; }
          elif git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then
            # tagged, but an earlier run stopped before the release and the image: finish it
            if gh release view "$v" >/dev/null 2>&1; then
              echo "$v is already released; nothing to do."
              echo "go=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$v is tagged but not released yet: finishing it."
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          fi
          echo "TAG=$v" >> "$GITHUB_ENV"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"
      - if: steps.v.outputs.go == 'true'
        run: npm ci
      # The screens, built once here: servers fetch them as the git tag screens-vX.Y.Z (deploy/screens.sh),
      # with the same access they use for the code, and never build anything themselves. Built before
      # the tests, which load them.
      - if: steps.v.outputs.go == 'true'
        run: npm run build
      - if: steps.v.outputs.go == 'true'
        run: npm test
      - if: steps.v.outputs.go == 'true'
        name: Tag this merge ${{ steps.v.outputs.tag }}
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || [ "${{ steps.v.outputs.tagged }}" = true ] && exit 0
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" tag -a "$TAG" -m "$TAG"
          git push -q origin "refs/tags/$TAG"
      - if: steps.v.outputs.go == 'true'
        name: Publish the built screens (tag screens-${{ steps.v.outputs.tag }})
        run: |
          git ls-remote --exit-code --tags origin "refs/tags/screens-$TAG" >/dev/null && exit 0  # published already
          d="$(mktemp -d)"; cp -r web/dist/. "$d"; cd "$d"
          git init -q -b screens && git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Screens for $TAG"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/tags/screens-$TAG"
      - if: steps.v.outputs.go == 'true'
        name: Notes from CHANGELOG.md
        run: |
          v="${TAG#v}"
          awk -v v="$v" '/^## /{p = index($0, "## " v " ") == 1 || $0 == "## " v} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - if: steps.v.outputs.go == 'true'
        name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
      # Docker's actions are pinned to the exact commit (the comment is the version it was), so a moved
      # tag can never change what runs with the token that publishes the image. GitHub's own actions
      # (actions/*, github/*) keep their version tags. Dependabot updates both.
      - if: steps.v.outputs.go == 'true'
        name: Container image (amd64 + arm64) to GitHub Container Registry
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: steps.v.outputs.go == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.v.outputs.go == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: steps.v.outputs.go == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
          # the plain number (0.17.1) is the tag the Home Assistant app installs
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.tag }}
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
      # The Home Assistant app (family-chalk-planner-ha) follows releases by itself every few hours; with a
      # token that may write to it (secret HA_REPO_TOKEN), it hears about this one right away
      - if: steps.v.outputs.go == 'true'
        name: Tell the Home Assistant app
        env:
          GH_TOKEN: ${{ secrets.HA_REPO_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "No HA_REPO_TOKEN: the app picks this release up on its next check"; exit 0; }
          gh api "repos/${{ github.repository_owner }}/family-chalk-planner-ha/dispatches" -f event_type=board-released
