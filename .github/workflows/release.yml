name: Release
# Push a tag like v0.4.4 (GitHub Desktop: History → right-click the commit → Create Tag…, then Push)
# and this checks the tag matches package.json, runs the tests, and publishes a GitHub Release with
# that version's notes from CHANGELOG.md, plus the Docker image ghcr.io/<owner>/family-chalk-planner.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json
        run: |
          v="$(node -p 'require("./package.json").version')"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but package.json says $v"; exit 1; }
      - run: npm ci
      - run: npm test
      # The screens, built once here: servers fetch them as the git tag screens-vX.Y.Z (deploy/screens.sh),
      # with the same access they use for the code, and never build anything themselves.
      - run: npm run build
      - name: Publish the built screens (tag screens-${{ github.ref_name }})
        run: |
          d="$(mktemp -d)"; cp -r web/dist/. "$d"; cd "$d"
          git init -q -b screens && git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Screens for $GITHUB_REF_NAME"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/tags/screens-$GITHUB_REF_NAME"
      - name: Notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = index($0, "## " v " ") == 1 || $0 == "## " v} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
      - name: Container image (amd64 + arm64) to GitHub Container Registry
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
