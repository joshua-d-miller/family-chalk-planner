name: CI
# Once per change: on pull requests (including next -> main), not again on the push to the same branch,
# on tags (the Release workflow tests those itself) or after the merge (the pull request already tested
# the merged result). "Run workflow" checks a branch that has no pull request.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # a newer push to the same pull request replaces the older run
permissions:
  contents: read
jobs:
  checks:
    name: Code checks (types, lint, formatting, security audit, shell scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node --check server/chalkboard.js
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - name: Known security problems in what the board ships
        run: npm audit --omit=dev --audit-level=high
      - name: ShellCheck
        run: shellcheck -S warning deploy/*.sh test/*.sh
      - name: Python syntax
        run: python3 -m py_compile face/facefocus.py
  server:
    name: Server and API tests (accounts, calendars, lists, photos, updates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build # some tests load the screens
      - run: npm test
  server-node22:
    # 32-bit Raspberry Pi OS can't run Node.js 24 or newer, so the board stays on 22 there until 22's end of
    # life (2027-04-30, deploy/node-version.sh): the server's tests run on it too
    name: Server and API tests on Node.js 22 (32-bit Raspberry Pi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
  install:
    name: Install and update scripts (fresh install, updates, a failed update undone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: sudo env "PATH=$PATH" bash test/deploy-scripts.sh
  screens:
    name: Screens in a real browser (wall, tablet, family screen, kid's tablet, phone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # the browser is kept between runs (it only changes with Playwright); its system packages are quick
      - uses: actions/cache@v4
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      # (once more after a pause if it fails: the runner's package mirror is sometimes briefly unreachable)
      - run: npx playwright install --with-deps chromium || (sleep 30 && npx playwright install --with-deps chromium)
        if: steps.pw.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium || (sleep 30 && npx playwright install-deps chromium)
        if: steps.pw.outputs.cache-hit == 'true'
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  homeassistant:
    name: The Home Assistant app against a real Home Assistant (logins, calendar, to-do list, sidebar, live updates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # a brand-new Home Assistant (the current release), started first: it takes a minute or two
      - name: Start Home Assistant
        run: |
          mkdir -p "$RUNNER_TEMP/ha" && cp test/real-homeassistant/configuration.yaml "$RUNNER_TEMP/ha/"
          docker run -d --name ha --network host -e TZ=America/New_York -v "$RUNNER_TEMP/ha:/config" \
            ghcr.io/home-assistant/home-assistant:stable
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium || (sleep 30 && npx playwright install --with-deps chromium)
        if: steps.pw.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium || (sleep 30 && npx playwright install-deps chromium)
        if: steps.pw.outputs.cache-hit == 'true'
      - run: npm run build
      - run: npm run test:homeassistant
      - name: Home Assistant's log
        if: failure()
        run: docker logs ha 2>&1 | tail -200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: home-assistant-test-report
          path: |
            playwright-report-ha/
            test-results-ha/
          retention-days: 7
  realservers:
    name: Real calendar and photo servers (Radicale CalDAV, Immich), no accounts
    runs-on: ubuntu-latest
    env:
      IMMICH_VERSION: v3 # the major version tested; Immich's own compose file, without its machine learning
    steps:
      - uses: actions/checkout@v7
      # Immich first: it takes a minute to start
      - name: Start Immich
        run: |
          mkdir -p "$RUNNER_TEMP/immich" && cd "$RUNNER_TEMP/immich"
          curl -fsSL -o docker-compose.yml https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
          curl -fsSL -o .env https://github.com/immich-app/immich/releases/latest/download/example.env
          sed -i "s/^IMMICH_VERSION=.*/IMMICH_VERSION=$IMMICH_VERSION/" .env
          # (the image registry sometimes says "too many requests": try the download a few times)
          for i in 1 2 3 4; do docker compose pull -q immich-server redis database && break; sleep $((i * 20)); done
          docker compose up -d immich-server redis database
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start Radicale
        run: |
          pip install radicale==3.5.4
          bash test/real-servers/start-radicale.sh "$RUNNER_TEMP/radicale"
      - name: Wait for Immich
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:2283/api/server/ping && exit 0
            sleep 2
          done
          exit 1
      - run: node --test test/real-servers.test.ts
        env:
          REAL_CALDAV_URL: http://127.0.0.1:5232/
          REAL_CALDAV_USER: family
          REAL_CALDAV_PASSWORD: secret
          REAL_IMMICH_URL: http://127.0.0.1:2283
      - name: Immich's log
        if: failure()
        run: docker logs immich_server 2>&1 | tail -200
  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Container image builds and starts
        run: |
          docker build -t fcp:ci .
          docker run -d --name fcp -p 3002:3002 fcp:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3002/api/today && break; sleep 1; done
          docker logs fcp 2>&1 | grep -q 'setup code' || { docker logs fcp; exit 1; }
          [ "$(docker exec fcp stat -c %u /data/chalkboard.db)" = 1000 ]
      - name: Docker and the Home Assistant app (options, Reset the admin, restart after saved settings)
        run: bash test/docker-smoke.sh fcp:ci
