name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check server/chalkboard.js
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: ShellCheck
        run: shellcheck -S warning deploy/*.sh test/*.sh
      - name: Install and update scripts (fresh install, updates from every starting point, failed update undone)
        run: sudo env "PATH=$PATH" bash test/deploy-scripts.sh
      - name: Python syntax
        run: python3 -m py_compile face/facefocus.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Container image builds and starts
        run: |
          docker build -t fcp:ci .
          docker run -d --name fcp -p 3002:3002 fcp:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3002/api/today && break; sleep 1; done
          docker logs fcp 2>&1 | grep -q 'setup code' || { docker logs fcp; exit 1; }
          [ "$(docker exec fcp stat -c %u /data/chalkboard.db)" = 1000 ]
