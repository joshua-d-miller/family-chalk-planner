name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check server/chalkboard.js
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: ShellCheck
        run: shellcheck -S warning deploy/*.sh
      - name: Python syntax
        run: python3 -m py_compile face/facefocus.py
