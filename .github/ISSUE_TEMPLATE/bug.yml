name: Something isn't working
description: Report a problem with the board, the tablet editor or the admin console
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Screenshots help a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom of ⚙️ Settings, or `deploy/update.sh --check` on the server.
      placeholder: v0.4.4
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options: [Wall display, Tablet / phone editor, Family touch screen, Admin console, Install / update]
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPad, Safari (home-screen app) · Fire tablet, Fully Kiosk
  - type: dropdown
    id: calendar
    attributes:
      label: Calendar
      options: [iCloud, Google, Other CalDAV, Not relevant]
  - type: textarea
    id: logs
    attributes:
      label: Server log (optional)
      description: "`journalctl -u family-chalk-planner -n 50` — remove anything private (emails, addresses)."
      render: text
