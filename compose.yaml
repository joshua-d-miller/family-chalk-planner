# Family Chalk Planner with Docker Compose — step by step in docs/docker.md
#   docker compose up -d
#   docker compose logs board      (the one-time setup code for /admin is printed here)
services:
  board:
    image: ghcr.io/joshua-d-miller/family-chalk-planner:latest
    # build: .                     # building from a copy of the code instead? uncomment, then: docker compose up -d --build
    container_name: family-chalk-planner
    restart: unless-stopped        # also how saved settings take effect (the board restarts itself)
    ports:
      - "3002:3002"
    volumes:
      - ./data:/data               # database, uploads, nightly backups: back this folder up
    environment:
      TZ: America/New_York         # the server's time zone (the board's own is set in the admin console)
      # PUID: 1000                 # user/group that owns ./data
      # PGID: 1000
    # Everything else (calendar, weather, photos, https address) is set in the admin console → ⚙️ Board.
